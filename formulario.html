<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>

<body>
    <section>
        <h2>Formulário</h2>
        <form action="cadastro.php" method="POST">
            <p>
                <label>Nome:</label>
                <input type="text" name="nome" placeholder="Digite seu nome" required>
            </p>
            <p>
                <label>Senha:</label>
                <input type="password" name="senha" maxlength="8" required>
            </p>
            <p>
                <label>Telefone:</label>
                <input type="text" name="telefone" pattern="\([0-9]{2}\)" placeholder="(99) 99999-9999" title="Use o"
                    required>
            </p>
            <p>
                <label>E-mail:</label>
                <input type="email" name="email" placeholder="e-mail" required>
            </p>
            <p>
                <label>CEP:</label>
                <input type="text" name="cep" pattern="[0-9]{5}-[0-9]{3}" title="Use o formato: 0000-000"
                    placeholder="0000-000">
            </p>
            <p>

                <label>Sobre você:</label>
                <textarea name="bio" rows="10" cols="100"></textarea>
            </p>
            <p>
                <label>Gênero:</label>
                <input type="radio" name="genero" value="M">Masculino
                <input type="radio" name="genero" value="F">Feminino
            </p>
            <p>
                <label>Interesses:</label>
                <input type="checkbox" name="interesses" value="tecnologia">tecnologia
                <input type="checkbox" name="interesses" value="esportes">Esportes
                <input type="checkbox" name="interesses" value="artes">Artes
            </p>
            <p><label>Pais:</label>
                <select name="pais">
                    <option value="">-----</option>
                    <option value="brasil">Brasil</option>
                    <option value="chile">Chile</option>
                </select>
        </form>
    </section>
</body>

</html>
